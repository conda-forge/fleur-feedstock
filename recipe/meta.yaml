{% set name = "fleur" %}
{% set version = "8.1" %}
{% set version_long = "MaX-R" + version %}

package:
  name: {{ name|lower }}
  version: "{{ version }}"

source:
  url: https://github.com/JuDFTteam/FLEUR/archive/refs/tags/{{ version_long }}.tar.gz
  sha256: d782bb7ae8cedbfe1d6818f242bb60fb41c535688b6303b648f5971c0427516e
  patches:
    - patches/skip_mtune_native_cross.patch  # [build_platform != target_platform]

build:
  number: 0
  skip: true  # [win]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('cxx') }}
    - {{ compiler('fortran') }}
    - cmake <4
    - make
    - git
    - doxygen
    - python >=3
    - pytest
    - masci-tools
    - openmpi  # [build_platform != target_platform]
  host:
    - openmpi
    - scalapack
    - libblas  # [osx]
    - openblas * *openmp*  # [linux]
    - liblapack
    - llvm-openmp  # [osx]
    - libgomp  # [linux]
    - libxml2-devel
    - fftw
    - hdf5 * *openmpi*
  run:
    - openmpi
    - scalapack
    - libblas  # [osx]
    - libblas * *openblas  # [linux]
    - openblas * *openmp*  # [linux]

test:
  commands:
    - inpgen -version
    - test -f $PREFIX/bin/fleur_MPI  # [unix]

about:
  home: https://www.flapw.de/
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: A feature-full, freely available FLAPW (full-potential linearized augmented planewave) code, based on density-functional theory
  description: |
    The FLAPW-Method is an all-electron method which within density functional theory is universally applicable to all atoms of the periodic table and to systems with compact as well as open structures. It is widely considered to be the most precise electronic structure method in solid state physics.
    an optional C extension for a serious speed boost.
  doc_url: https://www.flapw.de/
  dev_url: https://iffgit.fz-juelich.de/fleur/fleur

extra:
  recipe-maintainers:
    - mbercx
    - janssenhenning
